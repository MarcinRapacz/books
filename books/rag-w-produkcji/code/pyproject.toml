[project]
name = "ragbook"
version = "0.1.0"
description = "Shared code for the book 'RAG w produkcji' (AI Engineer, vol. 2)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
